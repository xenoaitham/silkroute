# SILKROUTE — sim-mode infrastructure network (docker-compose skeleton, Phase 0)
# Sim stand-ins per ADR-0001: MySQL 8 = ApsaraDB RDS, Kafka KRaft = Message Queue for Apache Kafka,
# Redis = ESB idempotency store, MinIO = OSS, Toxiproxy = fault injection harness.
# Cloud-mode equivalents are Terraform-managed (infra/) and only ever run for evidence capture (ADR-0002).
#
# Credentials: sim-only dummy values via .env (see .env.example). NEVER put real secrets here.
# Host ports bind 127.0.0.1 only — the sim network is for local development, not LAN exposure.

name: silkroute-sim

networks:
  sim-net:
    name: silkroute-sim-net

volumes:
  mysql-data:
  minio-data:
  kafka-data:

services:
  mysql:
    image: mysql:8.0
    container_name: sim-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-silkroute}
      MYSQL_DATABASE: oms
      TZ: Asia/Singapore
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks: [sim-net]
    healthcheck:
      # authenticated liveness probe; password comes from the container env, never hardcoded
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  kafka:
    image: apache/kafka:3.8.0
    container_name: sim-kafka
    environment:
      # canonical 22-char base64 UUID (generated via kafka-storage.sh random-uuid)
      CLUSTER_ID: CU-RSDF8RAWhB7Bh7dufAw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # dual listener: PLAINTEXT for in-compose clients (advertised kafka:9092),
      # HOST for host-side clients (advertised localhost:39092) — publishing 9092 alone
      # is useless from the host because bootstrap metadata advertises kafka:9092,
      # which is unresolvable off the compose network.
      # NOTE: host port 39092 — 29092 leaked in the rootlesskit port driver after a failed
      # bind (stuck container) and cannot be freed without restarting the daemon, which this
      # shared host cannot afford (an unrelated stack runs on the same rootless daemon).
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:39092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:39092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "127.0.0.1:39092:39092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks: [sim-net]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: sim-redis
    # host port 16379: 6379 is occupied by a pre-existing local Redis on this host;
    # container-internal port stays 6379 — all inter-container traffic is unaffected
    ports:
      - "127.0.0.1:16379:6379"
    networks: [sim-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  minio:
    # pinned release (was floating :latest) — ADR-0001 parity-drift mitigation
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: sim-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-silkroute}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-silkroute-secret}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    networks: [sim-net]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.11.0
    container_name: sim-toxiproxy
    ports:
      - "127.0.0.1:8474:8474"
    networks: [sim-net]
    # NOTE: ghcr.io/shopify/toxiproxy images are distroless (no shell/wget), so an
    # in-container healthcheck is impossible. Readiness is the API answering GET /version
    # on 8474; the Makefile/CI wait loop counts it healthy when State==running and Health=="".
