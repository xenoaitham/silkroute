# Spark batch logging: log4j2 is Spark's native backend (no extra binding).
# Keep Spark's own chatter at WARN so the SILKROUTE evidence lines stand out.
rootLogger.level = warn
rootLogger.appenderRef.stdout.ref = console

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX,UTC} %-5level %logger{36} - %msg%n

logger.silkroute.name = com.mapleretail.silkroute
logger.silkroute.level = info

logger.sparksql.name = org.apache.spark.sql
logger.sparksql.level = warn

logger.sparkws.name = org.apache.spark
logger.sparkws.level = warn

logger.hadoop.name = org.apache.hadoop
logger.hadoop.level = warn

logger.parquet.name = org.apache.parquet
logger.parquet.level = warn

logger.metastore.name = DataNucleus
logger.metastore.level = error
