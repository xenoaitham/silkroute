name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sim-compose:
    name: sim compose + smoke (mirrors README quickstart)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose config -q
      - name: Bring up sim network via the documented path
        run: make up
      - name: Status
        run: make ps
      - name: Smoke test (all five services)
        run: make smoke
      - name: Tear down
        if: always()
        run: make down

  # Phase 1+: java-build (mvnw test), contract-tests (karate), terraform-validate land here.

  legacy-erp-contract-tests:
    name: legacy-erp SOAP contract tests (Karate, frozen WSDLs)
    runs-on: ubuntu-latest
    # Black-box: boots the packaged fat jar itself (SERVER_PORT=18090) — no
    # containers, no docker, no services. Fails loudly if the jar is missing
    # or the app does not become healthy (falsifiable by construction).
    steps:
      - uses: actions/checkout@v4
      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build legacy-erp fat jar (unit tests included, contract suite is the second gate)
        run: ./mvnw -B -f apps/legacy-erp/pom.xml package
      - name: Run Karate SOAP 1.2 contract suite (boots the app, 16 scenarios)
        run: ./mvnw -B -f tests/contract/pom.xml verify
      - name: Archive Karate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: karate-contract-report
          path: tests/contract/target/karate-reports
          retention-days: 7
