name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sim-compose:
    name: sim compose + smoke (mirrors README quickstart)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate compose file
        run: docker compose config -q
      - name: Bring up sim network via the documented path (retried — Docker Hub anonymous pull denials are intermittent)
        run: |
          for i in 1 2 3; do
            if make up; then exit 0; fi
            echo "make up attempt $i failed (often a transient minio pull denial); retrying in 45s"
            sleep 45
          done
          exit 1
      - name: Status
        run: make ps
      - name: Smoke test (all five services)
        run: make smoke
      - name: Tear down
        if: always()
        run: make down

  # Phase 1+: java-build (mvnw test), contract-tests (karate), terraform-validate land here.

  legacy-erp-contract-tests:
    name: legacy-erp SOAP contract tests (Karate, frozen WSDLs)
    runs-on: ubuntu-latest
    # Black-box: boots the packaged fat jar itself (SERVER_PORT=18090) — no
    # containers, no docker, no services. Fails loudly if the jar is missing
    # or the app does not become healthy (falsifiable by construction).
    steps:
      - uses: actions/checkout@v5
      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build legacy-erp fat jar (unit tests included, contract suite is the second gate)
        run: ./mvnw -B -f apps/legacy-erp/pom.xml package
      - name: Run Karate SOAP 1.2 contract suite (boots the app, 16 scenarios)
        run: ./mvnw -B -f tests/contract/pom.xml verify
      - name: Archive Karate report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: karate-contract-report
          path: tests/contract/target/karate-reports
          retention-days: 7

  # Phase 2: ESB proof suite — retry / circuit-breaker / DLQ / saga compensation
  # under induced failure (toxiproxy), plus k6 p95 measurement happens on demand
  # via `make load-orders` (see tests/load/).
  esb-integration-tests:
    name: esb saga/retry/DLQ/compensation suite (boots ERP + ESB itself)
    runs-on: ubuntu-latest
    # Black-box: the suite boots the legacy-erp (18080) and esb (18081) fat jars
    # itself against the sim containers (toxiproxy 18474, kafka 39092, redis
    # 16379). Fails loudly if a jar is missing or an app does not become
    # healthy — never skips (falsifiable by construction).
    steps:
      - uses: actions/checkout@v5
      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Bring up sim network (toxiproxy + kafka + redis; retried against pull flake)
        run: |
          for i in 1 2 3; do
            if make up; then exit 0; fi
            echo "make up attempt $i failed (often a transient minio pull denial); retrying in 45s"
            sleep 45
          done
          exit 1
      - name: Build legacy-erp fat jar (unit tests run in the contract-tests job)
        run: ./mvnw -B -f apps/legacy-erp/pom.xml package -DskipTests
      - name: Build esb fat jar
        run: ./mvnw -B -f apps/esb/pom.xml package -DskipTests
      - name: Run ESB integration suite (boots ERP + ESB, injects faults)
        run: ./mvnw -B -f tests/esb-int/pom.xml verify
      - name: Archive surefire reports + boot logs + suite transcript
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: esb-int-artifacts
          path: |
            tests/esb-int/target/surefire-reports
            tests/esb-int/target/*.log
            tests/esb-int/target/*.pid
          retention-days: 7
      - name: Tear down
        if: always()
        run: make down

  # Phase 4: AliCloud landing zone — validated-plans mode (ADR-0002). fmt +
  # validate + plan with placeholder credentials; plans perform NO AliCloud API
  # calls (resources only, no API-calling data sources) and apply nothing. The
  # CN partition is plan-validated but never applied (ADR-0005).
  terraform-landing-zone:
    name: terraform fmt + validate + plan (validated-plans, ADR-0002)
    runs-on: ubuntu-latest
    env:
      TF_VAR_access_key: tf-placeholder-access-key
      TF_VAR_secret_key: tf-placeholder-secret-key
    steps:
      - uses: actions/checkout@v5
      - name: Set up Terraform 1.16.2
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.2
          terraform_wrapper: false
      - name: Apply-validity lint (plan-invisible API constraints, e.g. ApsaraMQ topic naming)
        run: bash scripts/tf-apply-validity.sh
      - name: fmt (check mode)
        run: terraform -chdir=infra fmt -check -recursive
      - name: init
        run: terraform -chdir=infra init -input=false
      - name: validate
        run: terraform -chdir=infra validate
      - name: plan (SG hub only, creates nothing)
        run: terraform -chdir=infra plan -input=false -no-color
      - name: plan (CN partition design — validated, never applied)
        run: terraform -chdir=infra plan -input=false -no-color -var enable_cn_region=true
